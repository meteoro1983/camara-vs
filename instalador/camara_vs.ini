; Camara VS - ajustes. Las teclas de ajuste (F7/F8, F10/F11, F3/F4, F6) guardan aca solas; F5 vuelve a la configuracion estandar.

[camara]
; 1 = arranca activa, 0 = arranca con la camara del juego (F9 cambia y se recuerda)
activa=1
; altura de la camara sobre el piso, en metros
altura=11
; retiro del riel de la camara detras de la linea de costado, en metros
distancia=10
; foco: menos = mas abierto (1430 es el de la camara "ancha" del juego)
zoom=470
; segundos de retraso del travelling (mas = mas suave y perezosa)
retraso=0.35
; segundos que se adelanta el punto de mira segun la velocidad de la pelota
adelanto=0.3
; giro steadycam hacia los arcos, 0..1 (Av Pag / Re Pag). Con la camara cerca la mete en la cancha,
; estilo tercera persona; lejos, giro de transmision
giro=0.2
; segundos con la pelota en los mismos pies para que la camara se acomode de frente
centrado=2.5
; metros por delante de la pelota (hacia el lado lejano) a los que apunta
mira=0

[teclas]
; codigos de tecla virtual de Windows (0x78 = F9, 0x76 = F7, ...)
activar=0x78
altura_menos=0x76
altura_mas=0x77
distancia_menos=0x79
distancia_mas=0x7A
zoom_abrir=0x72
zoom_cerrar=0x73
retraso=0x75
estandar=0x74
; giro hacia los arcos: Av Pag (0x22) menos, Re Pag (0x21) mas
giro_menos=0x22
giro_mas=0x21

[efectos]
; Blur de tribunas estilo Virtua Striker, anclado a la cancha (105 x 68 m): sirve para los estadios
; del juego y los de Kitserver. Los efectos se manejan desde el MENU DE EFECTOS: F2 lo abre y cierra;
; adentro F3/F4 eligen el efecto y F7/F8 cambian el valor (mientras esta abierto no mueven la camara).
; blur=0/1/2 y bruma=0/1/2: apagado / preset 1 / preset 2.
; atajos opcionales fuera del menu (0 = sin atajo; ej. 0x2D = Insert, 0x24 = Inicio, 0x2E = Supr, 0x23 = Fin)
tecla_bruma=0
tecla_color=0
tecla_mascara=0
blur=1
; 0..1+: multiplica la mezcla de todos los anillos
fuerza=1
; Medidas de las 6 cajas, en metros desde el centro, de adentro hacia afuera (laterales a 34 m,
; lineas de gol a 52,5 m). Del lado lejano el blur arranca 11 m adentro de la cancha; del lado de
; la camara 2,5 m adentro; en los fondos 1 m antes de la linea de gol, con anillos mas abiertos
; (detras de los arcos el blur es mas liviano).
lado_lejano=23 27 31 37 44 52
lado_camara=31.5 35 40 46 53 60
fondos=51.5 57 64 76 92 115
; mezcla del blur en cada anillo (0 = nitido, 1 = todo desenfocado)
mezcla=0.3 0.4 0.45 0.6 0.8 1
; ancho del blur en cada anillo: 1 = suave (escena a 1/2), 2 = medio (1/4), 3 = fuerte (1/8)
nivel=2 2 2 2 3 3
; Bruma: color de aire sobre los anillos de afuera (tribunas altas). auto = el color de niebla del
; juego (cambia con el estadio y la hora); si no, un color RRGGBB en hexa, p. ej. B4C3D2
bruma=1
bruma_fuerza=1
bruma_color=auto
bruma_mezcla=0 0 0.05 0.1 0.16 0.24
; Color grading sutil sobre el mundo 3D (el HUD no se toca): saturacion, contraste y ganancia R G B
color=1
color_saturacion=1.12
color_contraste=1.15
color_rgb=1 1 1
; Preset 2 del blur: entra mas en la cancha (lado lejano desde la linea del area grande),
; bastante mas fuerte y con blur mas ancho. Preset 2 de la bruma: mas baja y marcada.
lado_lejano_2=20 25 31 37 44 52
lado_camara_2=30.25 34 39 45 52 60
fondos_2=50.5 56 63 75 91 114
mezcla_2=0.35 0.6 0.75 0.9 1 1
nivel_2=2 2 3 3 3 3
bruma_mezcla_2=0.04 0.12 0.22 0.32 0.42 0.52
; 1 = recolorea el publico del add-on "Publico VS4" (si esta instalado publico_vs.dat)
publico_colores=1
; --- 1.3 ---
; filtrado anisotropico (0 = como el juego; 2..16)
anisotropico=8
; nitidez y vineta van con "Color y nitidez" del menu: 0 = nada
nitidez=0.35
vineta=0.18
; cancha (menu de efectos), suma de: 1 = franjas de cesped, 2 = sombra del estadio (solo de dia), 4 = borde oscuro
; alrededor de la cancha. El menu recorre: 7 (todo) -> 5 (sin sombra) -> 0 (nada)
cancha=7
tecla_cancha=0
; franjas: cantidad a lo largo de la cancha y cuanto oscurece la franja (0..1)
franjas=18
franjas_fuerza=0.07
; sombra sobre el lado lejano: linea en m desde el centro hacia ese lado, oscurecido y ancho de la penumbra (m)
sombra_linea=12
sombra_fuerza=0.25
sombra_penumbra=2.5
; de noche (deteccion automatica): bloom sutil sobre las luces
luces_noche=1
bloom=0.35
; tinte del cielo (va con "Color y nitidez")
cielo=1
; guia en pantalla (arriba al centro): aparece unos segundos al tocar una tecla de la camara o del blur;
; esta tecla la deja fija (0x70 = F1). activar = tecla del menu de efectos (0x71 = F2)
guia=0x70
guia_fija=0
activar=0x71
; 1 = pinta cada anillo de un color en lugar de desenfocar (para ajustar las medidas)
ver_mascara=0
; 1 = con F12 anota un cuadro completo de Direct3D en camara_vs_cuadro.txt
diagnostico=0
