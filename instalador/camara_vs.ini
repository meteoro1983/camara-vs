; Camara VS - ajustes. Las teclas de ajuste (F7/F8, F10/F11, F3/F4, F6) guardan aca solas; F5 vuelve a la configuracion estandar.

[camara]
; 1 = arranca activa, 0 = arranca con la camara del juego (F9 cambia y se recuerda)
activa=1
; altura de la camara sobre el piso, en metros
altura=11
; retiro del riel de la camara detras de la linea de costado, en metros
distancia=10
; foco: menos = mas abierto (1430 es el de la camara "ancha" del juego)
zoom=470
; segundos de retraso del travelling (mas = mas suave y perezosa)
retraso=0.35
; segundos que se adelanta el punto de mira segun la velocidad de la pelota
adelanto=0.3
; giro lateral maximo cerca de los arcos (0 = siempre de frente)
giro=0.2
; segundos con la pelota en los mismos pies para que la camara se acomode de frente
centrado=2.5
; metros por delante de la pelota (hacia el lado lejano) a los que apunta
mira=0

[teclas]
; codigos de tecla virtual de Windows (0x78 = F9, 0x76 = F7, ...)
activar=0x78
altura_menos=0x76
altura_mas=0x77
distancia_menos=0x79
distancia_mas=0x7A
zoom_abrir=0x72
zoom_cerrar=0x73
retraso=0x75
estandar=0x74

[efectos]
; Blur de tribunas estilo Virtua Striker, anclado a la cancha (105 x 68 m): sirve para los estadios
; del juego y los de Kitserver. F2 = blur, Ctrl+F2 = bruma, Shift+F2 = color, Ctrl+Shift+F2 = ver la mascara.
blur=1
; 0..1+: multiplica la mezcla de todos los anillos
fuerza=1
; Medidas de las 6 cajas, en metros desde el centro, de adentro hacia afuera (laterales a 34 m,
; lineas de gol a 52,5 m). Del lado lejano el blur arranca 7 m adentro de la cancha; del lado de
; la camara recien en la linea; en los fondos desde la linea de gol.
lado_lejano=27 30 34 39 45 52
lado_camara=34 38 42 47 53 60
fondos=52.5 56 60 65 71 78
; mezcla del blur en cada anillo (0 = nitido, 1 = todo desenfocado)
mezcla=0.15 0.3 0.45 0.6 0.8 1
; Bruma: color de aire sobre los anillos de afuera (tribunas altas). auto = el color de niebla del
; juego (cambia con el estadio y la hora); si no, un color RRGGBB en hexa, p. ej. B4C3D2
bruma=1
bruma_fuerza=1
bruma_color=auto
bruma_mezcla=0 0 0.05 0.1 0.16 0.24
; Color grading sutil sobre el mundo 3D (el HUD no se toca): saturacion, contraste y ganancia R G B
color=1
color_saturacion=1.12
color_contraste=1.08
color_rgb=1 1 1
; guia en pantalla (arriba al centro): aparece unos segundos al tocar una tecla de la camara o del blur;
; esta tecla la deja fija (0x70 = F1). activar = tecla del blur (0x71 = F2)
guia=0x70
guia_fija=0
activar=0x71
; 1 = pinta cada anillo de un color en lugar de desenfocar (para ajustar las medidas)
ver_mascara=0
; 1 = con F12 anota un cuadro completo de Direct3D en camara_vs_cuadro.txt
diagnostico=0
